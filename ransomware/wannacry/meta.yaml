name: WannaCry
description: Ransomware worm that used EternalBlue to spread globally in May 2017. Encrypted files and demanded Bitcoin ransom. Attributed to Lazarus Group (DPRK). Affected 200,000+ systems across 150 countries.
author: Lazarus Group (attributed)
year: 2017
os: windows
tags: [ransomware, worm, eternalblue, ms17-010, dprk, bitcoin]
